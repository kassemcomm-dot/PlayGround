- name: Build APK
  run: |
    GRADLEW=$(find . -name gradlew -type f | head -n 1)
    if [ -z "$GRADLEW" ]; then
      echo "gradlew not found"
      exit 1
    fi

    chmod +x "$GRADLEW"
    DIR=$(dirname "$GRADLEW")
    cd "$DIR"
    ./gradlew assembleDebug

- name: Find APK
  run: |
    find . -type f -name "*.apk"

- name: Upload APK
  uses: actions/upload-artifact@v4
  with:
    name: app-debug
    path: "**/build/outputs/apk/debug/*.apk"
